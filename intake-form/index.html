<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tell Us Your Story</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      Static form for Netlify's build-time form detection. Netlify scans the
      deployed HTML for a <form data-netlify="true"> at deploy time to know
      to capture submissions to it — this one is never shown or filled in by
      hand. The real submission happens via fetch() in app.js, using the same
      form name and field names declared here. See README.md for details.
    -->
    <form name="storytale-intake" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="respondent_name" />
      <input type="text" name="business_name" />
      <input type="text" name="submitted_at" />
      <textarea name="full_transcript"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <img src="images/logo.png" alt="Obsidian &amp; Gold" class="brand-watermark" />
    <div id="app"></div>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
